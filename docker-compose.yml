services:
  cnpm-db:
    image: postgres:16-alpine
    container_name: cnpm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cnpm_db
      POSTGRES_USER: cnpm_user
      POSTGRES_PASSWORD: cnpm_pass_2026
    ports:
      - "54321:5432"
    volumes:
      - cnpm_pg_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro

  cnpm-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cnpm-web
    restart: unless-stopped
    depends_on:
      - cnpm-db
    ports:
      - "8091:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  cnpm_pg_data:
