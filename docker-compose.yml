services:
  cnpm-db:
    image: postgres:16-alpine
    container_name: cnpm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cnpm_db}
      POSTGRES_USER: ${DB_USER:-cnpm_user}
      POSTGRES_PASSWORD: ${DB_PASS:-cnpm_pass_2026}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${PORT_DB:-54321}:5432"
    volumes:
      - cnpm_pg_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro

  cnpm-server:
    build:
      context: ./server
    container_name: cnpm-server
    restart: unless-stopped
    environment:
      DB_HOST: cnpm-db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-cnpm_db}
      DB_USER: ${DB_USER:-cnpm_user}
      DB_PASS: ${DB_PASS:-cnpm_pass_2026}
      VNPAY_ENABLED: ${VNPAY_ENABLED:-false}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:8091/api/v1/payments/vnpay/return}
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY:-${TOTP_ENCRYPTION_KEY:-local-development-only-change-me}}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-local-development-only-change-me}
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      cnpm-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT_API:-8080}:8080"
    expose:
      - "8080"

  cnpm-client:
    build:
      context: ./client
    container_name: cnpm-web
    restart: unless-stopped
    depends_on:
      - cnpm-server
    ports:
      - "${PORT_WEB:-8091}:80"

volumes:
  cnpm_pg_data:
