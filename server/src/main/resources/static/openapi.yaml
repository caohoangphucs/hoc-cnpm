openapi: 3.1.0
info:
  title: KTX Smart Hub API
  version: 1.0.0
  description: |
    API dùng session cookie. Trước khi đăng nhập, gọi GET /api/v1/auth/session và lấy csrfToken.
    Authorize Swagger bằng token đó, gọi login, sau đó gọi lại auth/session và cập nhật token mới
    trong Authorize. Trình duyệt tự gửi JSESSIONID cùng origin.
servers:
  - url: /
tags:
  - name: Auth
  - name: Rooms and bookings
  - name: Invoices and payments
  - name: Repairs
  - name: Gate and visitors
  - name: Discipline
  - name: Community
paths:
  /api/v1/materials:
    get:
      tags:
      - Repairs
      summary: Danh mục kho (ADMIN/KYTHUAT)
      responses:
        '200':
          description: Danh mục và tồn kho thực tế
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    unit:
                      type: string
                    stock:
                      type: integer
                      minimum: 0
                    price:
                      type: number
                      minimum: 0
    post:
      tags:
      - Repairs
      summary: Thêm mã vật tư mới (ADMIN/KYTHUAT)
      security:
      - csrfToken: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - name
              - unit
              - price
              properties:
                id:
                  type: string
                  maxLength: 20
                  pattern: ^[A-Za-z0-9_-]+$
                name:
                  type: string
                  maxLength: 100
                unit:
                  type: string
                  maxLength: 20
                stock:
                  type: integer
                  minimum: 0
                price:
                  type: integer
                  minimum: 0
                  maximum: 999999999999999
              example:
                id: VT-NEW
                name: Bóng đèn
                unit: cái
                stock: 10
                price: 25000
      responses:
        '200':
          $ref: '#/components/responses/Command'
        '409':
          description: Mã vật tư đã tồn tại
        '422':
          description: Dữ liệu không hợp lệ
  /api/v1/repairs/{id}/files:
    get:
      tags:
      - Repairs
      summary: Ảnh đã gắn vào phiếu theo quyền đọc
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: UUID ảnh
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        '404':
          description: Không tồn tại hoặc không được xem
  /api/v1/students:
    get:
      tags: [Gate]
      summary: Tìm sinh viên theo phạm vi tài khoản
      parameters:
        - name: search
          in: query
          schema: {type: string, maxLength: 100}
      responses:
        '200':
          description: Tối đa 30 sinh viên từ database; sinh viên chỉ nhận chính mình
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string}
                    name: {type: string}
                    room: {type: string, nullable: true}
        '403': {description: Không có quyền tìm sinh viên}
  /api/v1/repairs/{id}/priority:
    put:
      tags: [Repairs]
      summary: Kỹ thuật viên phụ trách đánh giá ưu tiên phiếu
      security: [{csrfToken: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority, version]
              properties:
                priority: {type: string, enum: [THAP, TRUNG_BINH, CAO, KHAN_CAP]}
                version: {type: integer, minimum: 1}
      responses:
        '200':
          description: Đã lưu đánh giá và tăng phiên bản
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandResult'}
        '403': {description: Chỉ kỹ thuật viên được đánh giá}
        '404': {description: Phiếu không thuộc kỹ thuật viên}
        '409': {description: Sai phiên bản hoặc phiếu không đang xử lý}
  /api/v1/activity-registrations:
    get:
      tags: [Community]
      summary: Lịch sử đăng ký công ích của tôi
      responses:
        '200':
          description: Mảng activity, receipt và cancelled; receipt.qrToken rỗng
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    activity:
                      type: object
                    receipt:
                      type: object
                    cancelled:
                      type: boolean
  /api/v1/activity-registrations/{id}/token:
    post:
      tags: [Community]
      summary: Cấp lại mã điểm danh cho phiếu của tôi
      security:
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Phiếu với qrToken mới; mã cũ hết hiệu lực
        '404':
          description: Không tìm thấy phiếu thuộc tài khoản
        '409':
          description: Phiếu đã hủy, điểm danh hoặc hoàn thành
  /api/v1/payments/vnpay/ipn:
    get:
      tags: [Payments]
      summary: VNPAY IPN xác nhận thanh toán (chữ ký provider)
      security: []
      parameters:
        - {name: vnp_TmnCode, in: query, required: true, schema: {type: string}}
        - {name: vnp_TxnRef, in: query, required: true, schema: {type: string}, description: UUID phiên bỏ dấu gạch nối}
        - {name: vnp_Amount, in: query, required: true, schema: {type: string}, description: Số tiền VND nhân 100}
        - {name: vnp_ResponseCode, in: query, required: true, schema: {type: string}}
        - {name: vnp_TransactionStatus, in: query, required: true, schema: {type: string}}
        - {name: vnp_TransactionNo, in: query, required: true, schema: {type: string}}
        - {name: vnp_SecureHash, in: query, required: true, schema: {type: string}, description: HMAC-SHA512 toàn bộ tham số vnp_ theo giao thức}
      responses:
        '200':
          description: Phản hồi giao thức VNPAY; không đồng nghĩa mọi yêu cầu thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  RspCode: {type: string, enum: ['00', '01', '04', '97', '99']}
                  Message: {type: string}
  /api/v1/payments/vnpay/return:
    get:
      tags: [Payments]
      summary: VNPAY ReturnURL chỉ xác minh và chuyển về trang trạng thái, không cập nhật công nợ
      security: []
      responses:
        '303': {description: Chuyển tới trang sinh viên với UUID phiên thanh toán}
        '400': {description: ReturnURL thiếu tham số hoặc chữ ký sai}

  /api/v1/rooms/{id}/meter-readings:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, example: D-102}
      - {name: month, in: query, required: true, schema: {type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'}, example: '2026-11'}
    get:
      tags: [Invoices]
      summary: Đọc số đo điện nước và phiên bản
      responses:
        '200':
          description: KETOAN/KYTHUAT/ADMIN; reading null khi chưa có số đo
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists: {type: boolean}
                  editable: {type: boolean}
                  revision: {type: string}
                  reading:
                    type: object
                    nullable: true
                    properties:
                      oldElectricity: {type: integer}
                      newElectricity: {type: integer}
                      oldWater: {type: integer}
                      newWater: {type: integer}
        '403': {description: Không có quyền hoặc chưa hoàn thành 2FA}
        '404': {description: Không có phòng}
        '422': {description: Kỳ tháng sai}
    put:
      tags: [Invoices]
      summary: Lưu số đo trước khi phát hành hóa đơn
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {name: X-Request-Id, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldElectricity, newElectricity, oldWater, newWater, revision]
              properties:
                oldElectricity: {type: integer, minimum: 0, maximum: 2147483647, example: 100}
                newElectricity: {type: integer, minimum: 0, maximum: 2147483647, example: 140}
                oldWater: {type: integer, minimum: 0, maximum: 2147483647, example: 20}
                newWater: {type: integer, minimum: 0, maximum: 2147483647, example: 25}
                revision: {type: string, description: Phiên bản lấy từ GET}
      responses:
        '200': {description: Đã lưu số đo và audit}
        '403': {description: Thiếu quyền hoặc CSRF}
        '404': {description: Không có phòng}
        '409': {description: Đã phát hành hoặc số đo thay đổi sau GET}
        '422': {description: Số đo hoặc kỳ tháng sai}

  /api/v1/invoices/unbilled-rooms:
    get:
      tags: [Invoices]
      summary: Danh sách phòng chưa có hóa đơn trong tháng
      parameters:
        - {name: month, in: query, required: true, schema: {type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'}, example: '2026-11'}
      responses:
        '200':
          description: Phòng chưa phát hành, chỉ dành cho kế toán
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string, example: DEMO-A}
                    buildingId: {type: string, example: TOA-A}
                    number: {type: string, example: DEMO-A}
        '422': {description: Tháng không hợp lệ}
        '403': {description: Không có quyền kế toán hoặc chưa hoàn thành 2FA}

  /api/v1/auth/session:
    get:
      tags: [Auth]
      summary: Get session and CSRF token
      operationId: getSession
      responses:
        '200':
          description: Current session and CSRF token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: login
      security: [{csrfToken: []}]
      requestBody: {$ref: '#/components/requestBodies/Login'}
      responses:
        '200': {description: Login successful, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/auth/2fa:
    post:
      tags: [Auth]
      summary: Verify authenticator code
      operationId: verifyTwoFactor
      security: [{csrfToken: []}]
      requestBody: {$ref: '#/components/requestBodies/Otp'}
      responses:
        '200': {description: Updated session, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/auth/2fa/setup:
    post:
      tags: [Auth]
      summary: Start authenticator setup
      operationId: startTwoFactorSetup
      security: [{csrfToken: []}]
      responses:
        '200': {description: Authenticator provisioning details, content: {application/json: {schema: {$ref: '#/components/schemas/TwoFactorSetup'}}}}
  /api/v1/auth/2fa/setup/confirm:
    post:
      tags: [Auth]
      summary: Confirm authenticator setup
      operationId: confirmTwoFactorSetup
      security: [{csrfToken: []}]
      requestBody: {$ref: '#/components/requestBodies/Otp'}
      responses:
        '200': {description: Updated session, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      operationId: logout
      security: [{csrfToken: []}]
      responses:
        '200': {description: Anonymous session and refreshed CSRF token, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}

  /api/v1/rooms:
    get:
      tags: [Rooms and bookings]
      summary: List rooms
      operationId: listRooms
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {description: Room page, content: {application/json: {schema: {$ref: '#/components/schemas/RoomPage'}}}}
    post:
      tags: [Rooms and bookings]
      summary: Create room (ADMIN)
      operationId: createRoom
      security: [{csrfToken: []}]
      requestBody: {$ref: '#/components/requestBodies/RoomWrite'}
      responses:
        '200': {$ref: '#/components/responses/Command'}
  /api/v1/rooms/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Rooms and bookings]
      summary: Get room
      operationId: getRoom
      responses:
        '200': {description: Room, content: {application/json: {schema: {$ref: '#/components/schemas/Room'}}}}
        '404': {$ref: '#/components/responses/Error'}
    put:
      tags: [Rooms and bookings]
      summary: Update room (ADMIN)
      operationId: updateRoom
      security: [{csrfToken: []}]
      requestBody: {$ref: '#/components/requestBodies/RoomWrite'}
      responses:
        '200': {$ref: '#/components/responses/Command'}
    delete:
      tags: [Rooms and bookings]
      summary: Delete room when no linked records exist (ADMIN)
      operationId: deleteRoom
      security: [{csrfToken: []}]
      responses:
        '200': {$ref: '#/components/responses/Command'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/rooms/{id}/beds:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Rooms and bookings]
      summary: List beds in room
      operationId: listRoomBeds
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {description: Bed page, content: {application/json: {schema: {$ref: '#/components/schemas/BedPage'}}}}
  /api/v1/beds:
    post:
      tags: [Rooms and bookings]
      summary: Create bed (ADMIN)
      operationId: createBed
      security: [{csrfToken: []}]
      requestBody: {$ref: '#/components/requestBodies/BedWrite'}
      responses:
        '200': {$ref: '#/components/responses/Command'}
  /api/v1/beds/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    put:
      tags: [Rooms and bookings]
      summary: Update bed (ADMIN)
      operationId: updateBed
      security: [{csrfToken: []}]
      requestBody: {$ref: '#/components/requestBodies/BedWrite'}
      responses:
        '200': {$ref: '#/components/responses/Command'}
    delete:
      tags: [Rooms and bookings]
      summary: Delete bed without booking/residency history (ADMIN)
      operationId: deleteBed
      security: [{csrfToken: []}]
      responses:
        '200': {$ref: '#/components/responses/Command'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/booking-windows:
    get:
      tags: [Rooms and bookings]
      summary: List currently open registration windows (SINHVIEN, ADMIN)
      operationId: listBookingWindows
      responses:
        '200':
          description: Open windows according to server time
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, semesterName]
                  properties:
                    id: {type: integer, minimum: 1, example: 900001}
                    name: {type: string}
                    semesterName: {type: string}
                    opensAt: {type: string, format: date-time}
                    closesAt: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/files:
    post:
      tags: [Rooms and bookings]
      summary: Upload private PNG/JPEG evidence as a draft (maximum 5 MiB)
      operationId: uploadEvidence
      security: [{csrfToken: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              properties:
                file: {type: string, format: binary, description: PNG/JPEG; at most 5242880 bytes and 20 megapixels, each dimension at most 6000 pixels}
                kind: {type: string, enum: [CCCD_FRONT, CCCD_BACK, STUDENT_CARD, REPAIR, EVIDENCE, POLICY]}
      responses:
        '200': {description: Private file metadata, content: {application/json: {schema: {$ref: '#/components/schemas/EvidenceFile'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '413': {description: Maximum file or multipart request size exceeded}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/files/{id}:
    parameters: [{$ref: '#/components/parameters/Uuid'}]
    get:
      tags: [Rooms and bookings]
      summary: Read private file metadata (owner or ADMIN for attached booking evidence)
      operationId: getEvidenceMetadata
      responses:
        '200': {description: File metadata, content: {application/json: {schema: {$ref: '#/components/schemas/EvidenceFile'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/files/{id}/content:
    parameters: [{$ref: '#/components/parameters/Uuid'}]
    get:
      tags: [Rooms and bookings]
      summary: View/download private image content with session and ownership checks
      operationId: getEvidenceContent
      parameters:
        - {name: download, in: query, required: false, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Validated PNG/JPEG bytes; Cache-Control no-store, Content-Disposition inline or attachment
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/bookings:
    get:
      tags: [Rooms and bookings]
      summary: List bookings visible to caller
      operationId: listBookings
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {description: Booking page, content: {application/json: {schema: {$ref: '#/components/schemas/BookingPage'}}}}
    post:
      tags: [Rooms and bookings]
      summary: Create a room booking (SINHVIEN)
      operationId: createBooking
      security: [{csrfToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Booking'}
      responses:
        '200': {$ref: '#/components/responses/Command'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/bookings/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Rooms and bookings]
      summary: Get booking
      operationId: getBooking
      responses:
        '200': {description: Booking detail, content: {application/json: {schema: {$ref: '#/components/schemas/Booking'}}}}
    delete:
      tags: [Rooms and bookings]
      summary: Delete a pending booking and release its bed
      operationId: deleteBooking
      security: [{csrfToken: []}]
      responses:
        '200': {$ref: '#/components/responses/Command'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/bookings/{id}/decision:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Rooms and bookings]
      summary: Approve or reject booking (ADMIN)
      operationId: decideBooking
      security: [{csrfToken: []}]
      requestBody: {$ref: '#/components/requestBodies/Approval'}
      responses:
        '200': {$ref: '#/components/responses/Command'}

  /api/v1/invoice-drafts:
    post:
      tags: [Invoices and payments]
      summary: Preview monthly invoices (KETOAN)
      operationId: previewInvoices
      security: [{csrfToken: []}]
      requestBody: {$ref: '#/components/requestBodies/InvoiceDraft'}
      responses:
        '200': {description: Draft snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/InvoiceDraft'}}}}
  /api/v1/invoices/issue:
    post:
      tags: [Invoices and payments]
      summary: Issue reviewed invoice draft (KETOAN)
      operationId: issueInvoices
      security: [{csrfToken: []}]
      requestBody: {$ref: '#/components/requestBodies/IssueInvoices'}
      responses:
        '200': {description: Result per room, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/IssueResult'}}}}}
  /api/v1/invoices:
    get:
      tags: [Invoices and payments]
      summary: List invoices visible to caller
      operationId: listInvoices
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {description: Invoice page, content: {application/json: {schema: {$ref: '#/components/schemas/InvoicePage'}}}}
  /api/v1/invoices/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Invoices and payments]
      summary: Get invoice and line items
      operationId: getInvoice
      responses:
        '200': {description: Invoice, content: {application/json: {schema: {$ref: '#/components/schemas/Invoice'}}}}
    put:
      tags: [Invoices and payments]
      summary: Update due date while unpaid (KETOAN/ADMIN)
      operationId: updateInvoice
      security: [{csrfToken: []}]
      requestBody: {$ref: '#/components/requestBodies/InvoiceUpdate'}
      responses:
        '200': {$ref: '#/components/responses/Command'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Invoices and payments]
      summary: Delete unpaid invoice without payments (KETOAN/ADMIN)
      operationId: deleteInvoice
      security: [{csrfToken: []}]
      responses:
        '200': {$ref: '#/components/responses/Command'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/payment-sessions:
    get:
      tags: [Invoices and payments]
      summary: List visible payment sessions
      operationId: listPaymentSessions
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {description: Payment sessions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/PaymentSession'}}}}}
    post:
      tags: [Invoices and payments]
      summary: Start payment session
      operationId: createPaymentSession
      security: [{csrfToken: []}]
      requestBody: {$ref: '#/components/requestBodies/Payment'}
      responses:
        '200': {description: Payment session, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentSession'}}}}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/payment-sessions/{id}:
    parameters: [{$ref: '#/components/parameters/Uuid'}]
    get:
      tags: [Invoices and payments]
      summary: Get payment session
      operationId: getPaymentSession
      responses:
