components:
  securitySchemes:
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Get this from GET /api/v1/auth/session. Login rotates the token; refresh it after login.
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string}}
    Uuid: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    Page: {name: page, in: query, required: false, schema: {type: integer, default: 1, minimum: 1}}
    PageSize: {name: pageSize, in: query, required: false, schema: {type: integer, default: 20, minimum: 1, maximum: 100}}
    Size: {name: size, in: query, required: false, schema: {type: integer, default: 20, minimum: 1, maximum: 100}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
  requestBodies:
    Login: {required: true, content: {application/json: {schema: {type: object, required: [username, password], properties: {username: {type: string, example: sv001}, password: {type: string, format: password, example: '123456'}}}}}}
    Otp: {required: true, content: {application/json: {schema: {type: object, required: [code], properties: {code: {type: string, pattern: '^[0-9]{6}$', example: '123456'}}}}}}
    RoomWrite: {required: true, content: {application/json: {schema: {type: object, required: [id, buildingId, number, floor, capacity, basePrice, status], properties: {id: {type: string}, buildingId: {type: string}, roomTypeId: {type: string, nullable: true}, number: {type: string}, floor: {type: integer, minimum: 1}, capacity: {type: integer, minimum: 1}, basePrice: {type: integer, minimum: 0}, status: {type: string, enum: [TRONG, CON_CHO, DAY, DANG_SUA, KHOA]}}}}}}
    BedWrite: {required: true, content: {application/json: {schema: {type: object, required: [id, roomId, number, status], properties: {id: {type: string}, roomId: {type: string}, number: {type: string}, position: {type: string, nullable: true}, status: {type: string, enum: [TRONG, GIU_CHO, DANG_O, KHOA]}}}}}}
    Booking: {required: true, content: {application/json: {schema: {type: object, required: [bedId, windowId, fileIds, acceptedTerms], properties: {bedId: {type: string}, windowId: {type: integer, format: int64}, fileIds: {type: array, minItems: 2, maxItems: 5, items: {type: string, format: uuid}}, acceptedTerms: {type: boolean, enum: [true]}}}}}}
    Approval: {required: true, content: {application/json: {schema: {type: object, required: [decision, version], properties: {decision: {type: string, enum: [DUYET, TU_CHOI]}, reason: {type: string, nullable: true}, version: {type: integer, format: int64, minimum: 1}}}}}}
    InvoiceDraft: {required: true, content: {application/json: {schema: {type: object, required: [month, roomIds], properties: {month: {type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$'}, roomIds: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string}}}}}}}
    IssueInvoices: {required: true, content: {application/json: {schema: {type: object, required: [draftId, version], properties: {draftId: {type: string, format: uuid}, version: {type: integer, format: int64, minimum: 1}}}}}}
    InvoiceUpdate: {required: true, content: {application/json: {schema: {type: object, required: [dueDate], properties: {dueDate: {type: string, format: date}}}}}}
    Payment: {required: true, content: {application/json: {schema: {type: object, required: [invoiceIds, gateway], properties: {invoiceIds: {type: array, minItems: 1, uniqueItems: true, items: {type: integer, format: int64, minimum: 1}}, gateway: {type: string, enum: [VNPAY, MOMO]}}}}}}
    Repair: {required: true, content: {application/json: {schema: {type: object, required: [title, description], properties: {title: {type: string, minLength: 1, maxLength: 255}, description: {type: string, minLength: 1, maxLength: 1000}, priority: {type: string, enum: [THAP, TRUNG_BINH, CAO, KHAN_CAP]}, fileIds: {type: array, maxItems: 5, items: {type: string, format: uuid}}}}}}}
    Assignment: {required: true, content: {application/json: {schema: {type: object, required: [technicianAccountId, scheduledAt, version], properties: {technicianAccountId: {type: integer, format: int64}, scheduledAt: {type: string, format: date-time}, version: {type: integer, format: int64}}}}}}
    RepairSchedule: {required: true, content: {application/json: {schema: {type: object, required: [version, scheduledAt, note], properties: {version: {type: integer, format: int64, minimum: 1}, scheduledAt: {type: string, format: date-time}, warrantyUntil: {type: string, format: date, nullable: true}, note: {type: string, minLength: 1, maxLength: 1000}}}}}}
    RepairComplete: {required: true, content: {application/json: {schema: {type: object, required: [version, note, supplies], properties: {fileIds: {type: array, maxItems: 10, items: {type: string, format: uuid}}, version: {type: integer, format: int64}, note: {type: string}, supplies: {type: array, items: {type: object, required: [supplyId, quantity], properties: {supplyId: {type: string}, quantity: {type: integer, minimum: 1}}}}, warrantyUntil: {type: string, format: date, nullable: true}}}}}}
    Entry: {required: true, content: {application/json: {schema: {type: object, required: [eventId, cardToken, type, deviceId], properties: {eventId: {type: string, format: uuid}, cardToken: {type: string, writeOnly: true}, type: {type: string, enum: [VAO, RA]}, deviceId: {type: string}, note: {type: string, nullable: true}}}}}}
    Visitor: {required: true, content: {application/json: {schema: {type: object, required: [hostStudentId, name, identity, validFrom, validTo], properties: {hostStudentId: {type: string}, name: {type: string, minLength: 2, maxLength: 100}, identity: {type: string, minLength: 6, maxLength: 12}, identityType: {type: string, enum: [CCCD, CMND, PASSPORT]}, validFrom: {type: string, format: date-time}, validTo: {type: string, format: date-time}}}}}}
    ViolationCreate: {required: true, content: {application/json: {schema: {type: object, required: [studentId, content, level], properties: {studentId: {type: string}, content: {type: string, maxLength: 2000}, level: {type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL]}, occurredAt: {type: string, format: date-time, nullable: true}}}}}}
    ViolationUpdate: {required: true, content: {application/json: {schema: {type: object, required: [content, level, version], properties: {content: {type: string, maxLength: 2000}, level: {type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL]}, version: {type: integer, format: int64, minimum: 1}}}}}}
    DisciplineDecision: {required: true, content: {application/json: {schema: {type: object, required: [violationIds, decision, reason, evidenceFileId, versions], properties: {violationIds: {type: array, minItems: 1, items: {type: integer, format: int64}}, decision: {type: string}, reason: {type: string}, evidenceFileId: {type: string, format: uuid}, versions: {type: object, additionalProperties: {type: integer, format: int64}}}}}}}
    Appeal: {required: true, content: {application/json: {schema: {type: object, required: [content], properties: {content: {type: string}}}}}}
    AppealResponse: {required: true, content: {application/json: {schema: {type: object, required: [accepted, reason, version], properties: {accepted: {type: boolean}, reason: {type: string}, version: {type: integer, format: int64}}}}}}
    Activity: {required: true, content: {application/json: {schema: {type: object, required: [semesterId, title, startAt, endAt, capacity, points], properties: {semesterId: {type: integer, format: int64}, title: {type: string}, startAt: {type: string, format: date-time}, endAt: {type: string, format: date-time}, capacity: {type: integer, format: int64}, points: {type: integer, format: int64}}}}}}
    Version: {required: true, content: {application/json: {schema: {type: object, required: [version], properties: {version: {type: integer, format: int64}}}}}}
    Attendance: {required: true, content: {application/json: {schema: {type: object, required: [qrToken], properties: {qrToken: {type: string}}}}}}
    Confirm: {required: true, content: {application/json: {schema: {type: object, required: [registrationIds], properties: {registrationIds: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: integer, format: int64}}}}}}}
    Convert: {required: true, content: {application/json: {schema: {type: object, required: [semesterId, drl], properties: {semesterId: {type: integer, format: int64}, drl: {type: integer, minimum: 1, maximum: 5}}}}}}
    Certificate: {required: true, content: {application/json: {schema: {type: object, required: [semesterId], properties: {semesterId: {type: integer, format: int64}}}}}}
  responses:
    Command:
      description: Command completed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Command'}
    Error:
      description: Request failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    EvidenceFile:
      type: object
      required: [id, kind, mime, sizeBytes, sha256, contentUrl]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [CCCD_FRONT, CCCD_BACK, STUDENT_CARD, REPAIR, EVIDENCE, POLICY]}
        mime: {type: string, enum: [image/png, image/jpeg]}
        sizeBytes: {type: integer, minimum: 1, maximum: 5242880}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        contentUrl: {type: string, example: /api/v1/files/00000000-0000-0000-0000-000000000000/content}
    Command:
      type: object
      properties:
        id: {type: string}
        status: {type: string}
        version: {type: integer, format: int64}
        requestId: {type: string, format: uuid}
    Error:
      type: object
      properties:
        code: {type: string}
        message: {type: string}
        requestId: {type: string, format: uuid}
        fieldErrors: {type: object, additionalProperties: {type: string}}
    Session:
      type: object
      properties:
        authenticated: {type: boolean}
        role: {type: string, nullable: true}
        twoFactorVerified: {type: boolean}
        csrfToken: {type: string}
        idleExpiresAt: {type: string, format: date-time, nullable: true}
        studentId: {type: string, nullable: true, description: MSSV của sinh viên đang đăng nhập}
    TwoFactorSetup:
      type: object
      properties:
        secret: {type: string}
        provisioningUri: {type: string}
    Page:
      type: object
      properties:
        page: {type: integer}
        pageSize: {type: integer}
        total: {type: integer, format: int64}
    Room:
      type: object
      properties:
        id: {type: string}
        buildingId: {type: string}
        roomType: {type: string}
        gender: {type: string}
        capacity: {type: integer, format: int64}
        availableBeds: {type: integer, format: int64}
    RoomPage:
      allOf: [{$ref: '#/components/schemas/Page'}]
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Room'}}
    Bed:
      type: object
      properties:
        id: {type: string}
        number: {type: string}
        status: {type: string}
        version: {type: integer, format: int64}
    BedPage:
      allOf: [{$ref: '#/components/schemas/Page'}]
      type: object
      properties:
