spring:
  application:
    name: ktx-smart-hub
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:54321}/${DB_NAME:cnpm_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:cnpm_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASS:cnpm_pass_2026}}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 10000
      connection-init-sql: SET TIME ZONE 'Asia/Ho_Chi_Minh'
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
security:
  file-encryption-key: ${FILE_ENCRYPTION_KEY:${TOTP_ENCRYPTION_KEY:local-development-only-change-me}}
  totp-encryption-key: ${TOTP_ENCRYPTION_KEY:local-development-only-change-me}
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 15m
      cookie:
        http-only: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml
    disable-swagger-default-url: true
    persist-authorization: true
    try-it-out-enabled: true

payment:
  vnpay:
    enabled: ${VNPAY_ENABLED:false}
    terminal: ${VNPAY_TMN_CODE:}
    secret: ${VNPAY_HASH_SECRET:}
    url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:https://cnpm.caohoangphuc.id.vn/api/v1/payments/vnpay/return}
