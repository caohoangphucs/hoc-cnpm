name: CI/CD Pipeline - CNPM (KTX Smart Hub)

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  database-schema-seed-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: RootPassword2026!
          POSTGRES_DB: cnpm_db
          POSTGRES_USER: cnpm_user
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 1. Apply Table Schema (01_schema.sql)
        env:
          PGPASSWORD: RootPassword2026!
        run: |
          echo "Applying database schema..."
          psql -h 127.0.0.1 -U cnpm_user -d cnpm_db -v ON_ERROR_STOP=1 -f database/01_schema.sql
          echo "Schema updated successfully."

      - name: 2. Load Seed Data (02_seed.sql)
        env:
          PGPASSWORD: RootPassword2026!
        run: |
          echo "Loading seed data..."
          psql -h 127.0.0.1 -U cnpm_user -d cnpm_db -v ON_ERROR_STOP=1 -f database/02_seed.sql
          echo "Seed data loaded successfully."

      - name: 3. Verify Database Integrity & Counts
        env:
          PGPASSWORD: RootPassword2026!
        run: |
          echo "Verifying tables and record counts..."
          psql -h 127.0.0.1 -U cnpm_user -d cnpm_db -c "
            SELECT 'SINH_VIEN' AS TableName, COUNT(*) AS Total FROM SINH_VIEN
            UNION ALL
            SELECT 'GIUONG', COUNT(*) FROM GIUONG
            UNION ALL
            SELECT 'HOA_DON', COUNT(*) FROM HOA_DON
            UNION ALL
            SELECT 'RA_VAO', COUNT(*) FROM RA_VAO;
          "

      - name: 4. Build with Maven
        run: mvn clean package -DskipTests
