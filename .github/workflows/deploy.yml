name: Backend and Frontend CI/CD
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ develop ]
permissions:
  contents: read
jobs:
  build-test-and-deploy:
    runs-on: [self-hosted, linux, x64, cnpm-deploy]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: RootPassword2026!
          POSTGRES_DB: cnpm_db
          POSTGRES_USER: cnpm_user
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cnpm_user -d cnpm_db"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI_SHA: ${{ github.sha }}
      CI_SERVER: cnpm-ci-server-${{ github.run_id }}-${{ github.run_attempt }}
      CI_CLIENT: cnpm-ci-client-${{ github.run_id }}-${{ github.run_attempt }}
      PGHOST: 127.0.0.1
      PGUSER: cnpm_user
      PGDATABASE: cnpm_db
      PGPASSWORD: RootPassword2026!
    steps:
      - uses: actions/checkout@v4
      - name: Resolve isolated test network and PostgreSQL port
        env:
          PG_SERVICE_ID: ${{ job.services.postgres.id }}
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          network=$(docker inspect "$PG_SERVICE_ID" --format '{{range $name, $settings := .NetworkSettings.Networks}}{{$name}}{{end}}')
          host=$(docker inspect "$PG_SERVICE_ID" --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          test -n "$network"; test -n "$host"
          printf 'CI_NETWORK=%s\nCI_DB_HOST=%s\nPGPORT=%s\n' "$network" "$host" "$PGPORT" >> "$GITHUB_ENV"
      - name: Apply schema and seed to disposable PostgreSQL16
        run: |
          psql -v ON_ERROR_STOP=1 --single-transaction -f database/01_schema.sql
          psql -v ON_ERROR_STOP=1 --single-transaction -f database/02_seed.sql
          test "$(psql -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE' AND table_name NOT LIKE 'svc_%'")" = 27
      - name: Verify additive migration upgrades the existing database schema
        run: |
          psql -v ON_ERROR_STOP=1 --single-transaction <<'SQL'
          DROP TABLE IF EXISTS svc_certificate, svc_conversion, svc_appeal, svc_discipline_decision,
            svc_visitor, svc_gate_event, svc_card, svc_purchase_request, svc_repair_history,
            svc_repair_assignment, svc_payment_callback, svc_payment_allocation, svc_payment_session,
            svc_room_extra, svc_invoice_snapshot, svc_invoice_draft, svc_outbox, svc_idempotency,
            svc_contract, svc_profile, svc_file, svc_repair_files, svc_room_price CASCADE;
          ALTER TABLE hoc_ky DROP COLUMN IF EXISTS public_id;
          ALTER TABLE hoat_dong DROP COLUMN IF EXISTS public_id, DROP COLUMN IF EXISTS version;
          ALTER TABLE giuong DROP COLUMN IF EXISTS version;
          ALTER TABLE dang_ky_phong DROP COLUMN IF EXISTS version;
          ALTER TABLE yeu_cau_sua_chua DROP COLUMN IF EXISTS version;
          ALTER TABLE vi_pham DROP COLUMN IF EXISTS version;
          ALTER TABLE dang_ky_cong_ich DROP COLUMN IF EXISTS version;
          ALTER TABLE dang_ky_cong_ich ADD CONSTRAINT uq_sv_hoatdong UNIQUE (mahoatdong,masinhvien);
          DROP INDEX IF EXISTS svc_active_student, svc_active_bed, svc_pending_booking,
            svc_active_community, svc_earned_once;
          SQL
          psql -v ON_ERROR_STOP=1 --single-transaction -f database/migrations/V20261004__service_runtime_schema.sql
          psql -v ON_ERROR_STOP=1 --single-transaction -f database/migrations/V20261004__service_runtime_schema.sql
          test "$(psql -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name LIKE 'svc_%'")" = 23
          test "$(psql -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='public' AND ((table_name IN ('giuong','dang_ky_phong','yeu_cau_sua_chua','vi_pham','hoat_dong','dang_ky_cong_ich') AND column_name='version') OR (table_name IN ('hoc_ky','hoat_dong') AND column_name='public_id'))")" = 8
      - name: Verify room type mojibake migration restores Vietnamese labels
        run: |
          psql -v ON_ERROR_STOP=1 --single-transaction <<'SQL'
          UPDATE loai_phong
          SET tenloaiphong=convert_from(convert_to(tenloaiphong,'UTF8'),'LATIN1')
          WHERE maloaiphong IN ('LP-2','LP-4','LP-6');
          SQL
          psql -v ON_ERROR_STOP=1 --single-transaction -f database/migrations/V20261005__repair_room_type_utf8.sql
          psql -v ON_ERROR_STOP=1 --single-transaction -f database/migrations/V20261005__repair_room_type_utf8.sql
          test "$(psql -Atc "SELECT COUNT(*) FROM loai_phong WHERE (maloaiphong='LP-2' AND tenloaiphong='Phòng VIP 2 Giường') OR (maloaiphong='LP-4' AND tenloaiphong='Phòng Tiêu Chuẩn 4 Giường') OR (maloaiphong='LP-6' AND tenloaiphong='Phòng Tiêu Chuẩn 6 Giường')")" = 3
      - name: Verify Vietnamese display data repair and encoding boundaries
        run: psql -v ON_ERROR_STOP=1 -f database/tests/vietnamese_encoding.sql
      - name: Verify missing community seed migration preserves existing activities
        run: psql -v ON_ERROR_STOP=1 -f database/tests/community_backfill.sql
      - name: Verify legacy demo password migration preserves changed passwords
        run: psql -v ON_ERROR_STOP=1 -f database/tests/demo_password_migration.sql
      - name: Apply unissued invoice demo month
        run: psql -v ON_ERROR_STOP=1 --single-transaction -f database/migrations/V20261011__seed_unissued_invoice_month.sql
      - name: Repair demo gate violation ownership
        run: psql -v ON_ERROR_STOP=1 --single-transaction -f database/migrations/V20261012__repair_seed_gate_violation_links.sql
      - name: Verify discipline decision migration preserves long review reasons
        run: psql -v ON_ERROR_STOP=1 -f database/tests/discipline_decision_width.sql
      - name: Expand discipline decision storage without resetting data
        run: psql -v ON_ERROR_STOP=1 --single-transaction -f database/migrations/V20261013__discipline_decision_text.sql
      - name: Expand invoice meter quantity storage
        run: psql -v ON_ERROR_STOP=1 --single-transaction -f database/migrations/V20261014__support_invoice_meter_quantity.sql
      - name: Apply encrypted evidence storage migration
        run: psql -v ON_ERROR_STOP=1 --single-transaction -f database/migrations/V20261010__evidence_file_content.sql
      - name: Build backend and run Java unit tests
        run: docker build --target build -t "cnpm-server-build:$CI_SHA" server
      - name: Run controller tests with MockMvc (no real HTTP or database)
        run: |
          docker run --rm --network "$CI_NETWORK" \
            --entrypoint java "cnpm-server-build:$CI_SHA" \
            -cp '/app/target/classes:/app/target/test-classes:/app/target/test-libs/*' \
            org.junit.platform.console.ConsoleLauncher execute \
            --select-class vn.id.caohoangphuc.cnpm.api.ApiRoutesTest \
            --select-class vn.id.caohoangphuc.cnpm.api.BookingControllerTest \
            --fail-if-no-tests
      - name: Run API black-box tests with HTTP and PostgreSQL
        run: |
          docker run --rm --network "$CI_NETWORK" \
            -e DB_HOST="$CI_DB_HOST" -e DB_PORT=5432 -e DB_NAME=cnpm_db \
            -e DB_USER=cnpm_user -e DB_PASS="$PGPASSWORD" \
            -e KTX_PERSONAL_DATA_KEY="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" \
            --entrypoint java "cnpm-server-build:$CI_SHA" \
            -cp '/app/target/classes:/app/target/test-classes:/app/target/test-libs/*' \
            org.junit.platform.console.ConsoleLauncher execute \
            --select-class vn.id.caohoangphuc.cnpm.persistence.DatabaseFoundationIT \
            --select-class vn.id.caohoangphuc.cnpm.service.ServiceAuthorizationIT \
            --select-class vn.id.caohoangphuc.cnpm.api.BookingApiBlackBoxIT \
            --select-class vn.id.caohoangphuc.cnpm.api.RoomCatalogApiBlackBoxIT \
            --select-class vn.id.caohoangphuc.cnpm.api.RemainingUseCasesApiBlackBoxIT \
            --select-class vn.id.caohoangphuc.cnpm.api.AdminTwoFactorApiBlackBoxIT \
            --fail-if-no-tests --details=summary
      - name: Verify complete demo seed and preserved user changes
        run: |
          psql -v ON_ERROR_STOP=1 -f database/tests/demo_usecases_migration.sql
          psql -v ON_ERROR_STOP=1 --single-transaction -f database/migrations/V20261009__complete_demo_usecases.sql
      - name: Apply linked residency seed and verify data consistency
        run: |
          psql -v ON_ERROR_STOP=1 --single-transaction -f database/migrations/V20261015__link_seed_residencies.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/residency_links.sql
      - name: Verify seeded demo cases through real HTTP and PostgreSQL
        run: |
          docker run --rm --network "$CI_NETWORK" \
            -e DB_HOST="$CI_DB_HOST" -e DB_PORT=5432 -e DB_NAME=cnpm_db \
            -e DB_USER=cnpm_user -e DB_PASS="$PGPASSWORD" \
            -e KTX_PERSONAL_DATA_KEY="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" \
            --entrypoint java "cnpm-server-build:$CI_SHA" \
            -cp '/app/target/classes:/app/target/test-classes:/app/target/test-libs/*' \
            org.junit.platform.console.ConsoleLauncher execute \
            --select-class vn.id.caohoangphuc.cnpm.api.DemoSeedApiIT \
            --select-class vn.id.caohoangphuc.cnpm.api.EvidenceFileApiIT \
            --fail-if-no-tests --details=summary
      - name: Build immutable backend and frontend images locally
        run: |
          docker build --label "cnpm.commit=$CI_SHA" -t "cnpm-server-ci:$CI_SHA" server
          docker build --label "cnpm.commit=$CI_SHA" -t "cnpm-client-ci:$CI_SHA" client
      - name: Smoke test frontend Nginx and backend readiness together
        run: |
          docker run -d --name "$CI_SERVER" --network "$CI_NETWORK" --network-alias cnpm-server \
            -e DB_HOST="$CI_DB_HOST" -e DB_PORT=5432 -e DB_NAME=cnpm_db \
            -e DB_USER=cnpm_user -e DB_PASS="$PGPASSWORD" "cnpm-server-ci:$CI_SHA"
          docker run -d --name "$CI_CLIENT" --network "$CI_NETWORK" \
            -p 127.0.0.1::80 "cnpm-client-ci:$CI_SHA"
          mapping=$(docker port "$CI_CLIENT" 80/tcp)
          base="http://127.0.0.1:${mapping##*:}"
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$base/api/health" > "$RUNNER_TEMP/cnpm-health.json" \
                && grep -q '"status":"UP"' "$RUNNER_TEMP/cnpm-health.json"; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          curl --fail --silent "$base/" > "$RUNNER_TEMP/cnpm-index.html"
          grep -q 'KTX Smart Hub' "$RUNNER_TEMP/cnpm-index.html"
          asset=$(sed -n 's/.*src="\([^"]*\/assets\/[^\"]*\)".*/\1/p' "$RUNNER_TEMP/cnpm-index.html")
          test -n "$asset"
          curl --fail --silent "$base$asset" > /dev/null
          curl --fail --silent "$base/activities" | grep -q 'KTX Smart Hub'
          curl --fail --silent --show-error --location "$base/swagger-ui.html" | grep -q 'Swagger UI'
          curl --fail --silent "$base/openapi.yaml" | grep -q 'openapi: 3.1.0'
          curl --fail --silent "$base/v3/api-docs/swagger-config" | grep -q '/openapi.yaml'
          docker exec "$CI_CLIENT" nginx -t
          if docker logs "$CI_SERVER" 2>&1 | grep -E 'ERROR|APPLICATION FAILED TO START'; then exit 1; fi
      - name: Deploy verified develop images with Docker Compose
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: bash scripts/deploy-server.sh "$CI_SHA" "cnpm-server-ci:$CI_SHA" "cnpm-client-ci:$CI_SHA"
      - name: Logs and isolated container cleanup
        if: always()
        run: |
          for container in "$CI_CLIENT" "$CI_SERVER"; do
            if docker inspect "$container" >/dev/null 2>&1; then
              docker logs "$container" 2>&1
              docker rm -f "$container"
            fi
          done
