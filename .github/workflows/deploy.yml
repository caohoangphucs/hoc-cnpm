name: Backend and Frontend CI/CD
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ develop ]
permissions:
  contents: read
jobs:
  build-test-and-deploy:
    runs-on: [self-hosted, linux, x64, cnpm-deploy]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: RootPassword2026!
          POSTGRES_DB: cnpm_db
          POSTGRES_USER: cnpm_user
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cnpm_user -d cnpm_db"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI_SHA: ${{ github.sha }}
      CI_SERVER: cnpm-ci-server-${{ github.run_id }}-${{ github.run_attempt }}
      CI_CLIENT: cnpm-ci-client-${{ github.run_id }}-${{ github.run_attempt }}
      PGHOST: 127.0.0.1
      PGUSER: cnpm_user
      PGDATABASE: cnpm_db
      PGPASSWORD: RootPassword2026!
    steps:
      - uses: actions/checkout@v4
      - name: Resolve isolated test network and PostgreSQL port
        env:
          PG_SERVICE_ID: ${{ job.services.postgres.id }}
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          network=$(docker inspect "$PG_SERVICE_ID" --format '{{range $name, $settings := .NetworkSettings.Networks}}{{$name}}{{end}}')
          host=$(docker inspect "$PG_SERVICE_ID" --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          test -n "$network"; test -n "$host"
          printf 'CI_NETWORK=%s\nCI_DB_HOST=%s\nPGPORT=%s\n' "$network" "$host" "$PGPORT" >> "$GITHUB_ENV"
      - name: Apply schema and seed to disposable PostgreSQL16
        run: |
          psql -v ON_ERROR_STOP=1 --single-transaction -f database/01_schema.sql
          psql -v ON_ERROR_STOP=1 --single-transaction -f database/02_seed.sql
          test "$(psql -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE' AND table_name NOT LIKE 'svc_%'")" = 27
      - name: Build backend and run Java unit tests
        run: docker build --target build -t "cnpm-server-build:$CI_SHA" server
      - name: Run controller tests with MockMvc (no real HTTP or database)
        run: |
          docker run --rm --network "$CI_NETWORK" \
            --entrypoint java "cnpm-server-build:$CI_SHA" \
            -cp '/app/target/classes:/app/target/test-classes:/app/target/test-libs/*' \
            org.junit.platform.console.ConsoleLauncher execute \
            --select-class vn.id.caohoangphuc.cnpm.api.ApiRoutesTest \
            --select-class vn.id.caohoangphuc.cnpm.api.BookingControllerTest \
            --fail-if-no-tests
      - name: Run API black-box tests with HTTP and PostgreSQL
        run: |
          docker run --rm --network "$CI_NETWORK" \
            -e DB_HOST="$CI_DB_HOST" -e DB_PORT=5432 -e DB_NAME=cnpm_db \
            -e DB_USER=cnpm_user -e DB_PASS="$PGPASSWORD" \
            --entrypoint java "cnpm-server-build:$CI_SHA" \
            -cp '/app/target/classes:/app/target/test-classes:/app/target/test-libs/*' \
            org.junit.platform.console.ConsoleLauncher execute \
            --select-class vn.id.caohoangphuc.cnpm.persistence.DatabaseFoundationIT \
            --select-class vn.id.caohoangphuc.cnpm.service.ServiceAuthorizationIT \
            --select-class vn.id.caohoangphuc.cnpm.api.BookingApiBlackBoxIT \
            --select-class vn.id.caohoangphuc.cnpm.api.RemainingUseCasesApiBlackBoxIT \
            --fail-if-no-tests --details=summary
      - name: Build immutable backend and frontend images locally
        run: |
          docker build --label "cnpm.commit=$CI_SHA" -t "cnpm-server-ci:$CI_SHA" server
          docker build --label "cnpm.commit=$CI_SHA" -t "cnpm-client-ci:$CI_SHA" client
      - name: Smoke test frontend Nginx and backend readiness together
        run: |
          docker run -d --name "$CI_SERVER" --network "$CI_NETWORK" --network-alias cnpm-server \
            -e DB_HOST="$CI_DB_HOST" -e DB_PORT=5432 -e DB_NAME=cnpm_db \
            -e DB_USER=cnpm_user -e DB_PASS="$PGPASSWORD" "cnpm-server-ci:$CI_SHA"
          docker run -d --name "$CI_CLIENT" --network "$CI_NETWORK" \
            -p 127.0.0.1::80 "cnpm-client-ci:$CI_SHA"
          mapping=$(docker port "$CI_CLIENT" 80/tcp)
          base="http://127.0.0.1:${mapping##*:}"
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$base/api/health" > "$RUNNER_TEMP/cnpm-health.json" \
                && grep -q '"status":"UP"' "$RUNNER_TEMP/cnpm-health.json"; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          curl --fail --silent "$base/" > "$RUNNER_TEMP/cnpm-index.html"
          grep -q 'KTX Smart Hub' "$RUNNER_TEMP/cnpm-index.html"
          asset=$(sed -n 's/.*src="\([^"]*\/assets\/[^\"]*\)".*/\1/p' "$RUNNER_TEMP/cnpm-index.html")
          test -n "$asset"
          curl --fail --silent "$base$asset" > /dev/null
          curl --fail --silent "$base/activities" | grep -q 'KTX Smart Hub'
          docker exec "$CI_CLIENT" nginx -t
          if docker logs "$CI_SERVER" 2>&1 | grep -E 'ERROR|APPLICATION FAILED TO START'; then exit 1; fi
      - name: Deploy verified develop images with Docker Compose
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: bash scripts/deploy-server.sh "$CI_SHA" "cnpm-server-ci:$CI_SHA" "cnpm-client-ci:$CI_SHA"
      - name: Logs and isolated container cleanup
        if: always()
        run: |
          for container in "$CI_CLIENT" "$CI_SERVER"; do
            if docker inspect "$container" >/dev/null 2>&1; then
              docker logs "$container" 2>&1
              docker rm -f "$container"
            fi
          done
