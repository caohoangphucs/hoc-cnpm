map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}
map $uri $cache_control {
    default no-store;
    ~^/assets/ "public, max-age=31536000, immutable";
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 26m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://cnpm-server:8080;
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP"}';
    }
    location = /api/health {
        proxy_pass $backend/actuator/health/readiness;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location ~ ^/(swagger-ui\.html|swagger-ui/|openapi\.yaml|v3/api-docs) {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
